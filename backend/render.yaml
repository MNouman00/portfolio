services:
  - type: web
    name: nouman-portfolio-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "gunicorn portfolio_project.wsgi --bind 0.0.0.0:$PORT --log-file -"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "nouman-portfolio-api.onrender.com"
      - key: ADMIN_USERNAME
        value: "nouman"
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_ACCESS_MINUTES
        value: "480"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio_user
    plan: free
    region: oregon